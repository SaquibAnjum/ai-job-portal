version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ai_job_portal_db
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  server:
    build: .
    container_name: ai_job_portal_server
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ai_job_portal
      - JWT_SECRET=super_secret_jwt_access_key_2026_antigravity
      - CLIENT_URL=http://localhost:5173
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb

volumes:
  mongo_data:
